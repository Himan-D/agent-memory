name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    name: Prepare Copilot coding agent environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
            landing/package-lock.json
            sdk/nodejs/package-lock.json
            skills-npm/package-lock.json

      - name: Download Go dependencies
        run: go mod download

      - name: Install root Node dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm --prefix dashboard ci --legacy-peer-deps

      - name: Install landing dependencies
        run: npm --prefix landing ci

