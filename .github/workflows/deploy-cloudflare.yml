name: Deploy Cloudflare (All)

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'landing/**'
      - 'dashboard/**'
      - 'install.sh'
      - 'wrangler.jsonc'
      - 'dashboard/wrangler.jsonc'
      - 'workers/**'
      - 'scripts/build-docs.sh'
      - 'scripts/deploy-cloudflare.sh'
      - 'docs/**'
      - '.github/workflows/deploy*.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - landing
          - dashboard

jobs:
  changes:
    name: Detect deploy targets
    runs-on: ubuntu-latest
    outputs:
      landing: ${{ steps.filter.outputs.landing }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            landing:
              - 'landing/**'
              - 'install.sh'
              - 'wrangler.jsonc'
              - 'workers/**'
              - 'scripts/build-docs.sh'
              - 'docs/**'
              - '.github/workflows/deploy*.yml'
            dashboard:
              - 'dashboard/**'
              - 'dashboard/wrangler.jsonc'
              - 'scripts/deploy-cloudflare.sh'
              - '.github/workflows/deploy*.yml'

  deploy-landing:
    name: Deploy landing (hystersis.com)
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'landing' || github.event.inputs.target == 'all')) ||
      (github.event_name == 'push' && needs.changes.outputs.landing == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Check Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "mode=workers-builds" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy landing via GitHub Actions
        if: steps.cf.outputs.mode == 'token'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/deploy-cloudflare.sh landing

      - name: Skip — Workers Builds handles landing
        if: steps.cf.outputs.mode == 'workers-builds'
        run: |
          echo "::notice::Landing deploy skipped — hystersis.com auto-deploys via Cloudflare Workers Builds."

  deploy-dashboard:
    name: Deploy dashboard (app.hystersis.com)
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'dashboard' || github.event.inputs.target == 'all')) ||
      (github.event_name == 'push' && needs.changes.outputs.dashboard == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Check Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "mode=workers-builds" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy dashboard via GitHub Actions
        if: steps.cf.outputs.mode == 'token'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_URL: https://api.hystersis.com
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || secrets.NEXTAUTH_SECRET }}
          BETTER_AUTH_API_KEY: ${{ secrets.BETTER_AUTH_API_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: bash scripts/deploy-cloudflare.sh dashboard

      - name: Skip — Workers Builds handles dashboard
        if: steps.cf.outputs.mode == 'workers-builds'
        run: |
          echo "::notice::Dashboard deploy skipped — connect Cloudflare Workers Builds for hystersis-app (root: dashboard) or add CLOUDFLARE_API_TOKEN."

  verify-production:
    name: Verify production dashboard
    needs: [changes, deploy-dashboard]
    if: |
      always() &&
      needs.changes.outputs.dashboard == 'true' &&
      needs.deploy-dashboard.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check sign-in page is up to date
        run: |
          set -euo pipefail
          html=$(curl -fsSL "https://app.hystersis.com/auth/signin" || echo "FETCH_FAILED")

          if [ "$html" = "FETCH_FAILED" ]; then
            echo "::error::Could not fetch https://app.hystersis.com/auth/signin"
            exit 1
          fi

          if echo "$html" | grep -qi "Demo Credentials"; then
            echo "::error::Production still shows demo credentials — dashboard deploy is stale."
            echo "Merge is on master but app.hystersis.com was not redeployed."
            echo "Run: cd dashboard && rm -rf .next .open-next && npm run deploy"
            exit 1
          fi

          if ! echo "$html" | grep -qi "Welcome back"; then
            echo "::warning::Sign-in page missing expected 'Welcome back' heading — may still be old UI."
          fi

          echo "Production sign-in page looks current (no demo credentials)."

      - name: Check key endpoints respond
        run: |
          set +e
          for url in \
            "https://app.hystersis.com/auth/signin" \
            "https://app.hystersis.com/demo" \
            "https://hystersis.com/"
          do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$url" || echo "000")
            echo "$url → HTTP $code"
            if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
              echo "::warning::$url returned $code"
            fi
          done
