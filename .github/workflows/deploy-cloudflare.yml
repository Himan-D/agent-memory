name: Deploy Cloudflare (All)

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'landing/**'
      - 'dashboard/**'
      - 'install.sh'
      - 'wrangler.jsonc'
      - 'dashboard/wrangler.jsonc'
      - 'workers/**'
      - 'scripts/build-docs.sh'
      - 'scripts/build-cloudflare.sh'
      - 'scripts/deploy-cloudflare.sh'
      - 'scripts/deploy-dashboard-builds.sh'
      - 'scripts/verify-domains.sh'
      - 'scripts/verify-production.sh'
      - 'docs/**'
      - '.github/workflows/deploy*.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - landing
          - docs
          - dashboard

jobs:
  changes:
    name: Detect deploy targets
    runs-on: ubuntu-latest
    outputs:
      landing: ${{ steps.filter.outputs.landing }}
      docs: ${{ steps.filter.outputs.docs }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            landing:
              - 'landing/**'
              - 'install.sh'
              - 'wrangler.jsonc'
              - 'workers/**'
              - 'scripts/build-cloudflare.sh'
              - 'scripts/verify-production.sh'
              - 'scripts/verify-domains.sh'
              - 'scripts/preflight-cloudflare-token.sh'
              - '.github/workflows/deploy*.yml'
            docs:
              - 'docs/**'
              - 'scripts/build-docs.sh'
              - 'scripts/rewrite-docs-assets.sh'
              - 'scripts/deploy-cloudflare.sh'
              - 'scripts/verify-production.sh'
              - 'scripts/verify-domains.sh'
              - 'scripts/preflight-cloudflare-token.sh'
              - '.github/workflows/deploy*.yml'
            dashboard:
              - 'dashboard/**'
              - 'dashboard/wrangler.jsonc'
              - 'scripts/deploy-cloudflare.sh'
              - 'scripts/deploy-dashboard-builds.sh'
              - 'scripts/verify-domains.sh'
              - 'scripts/preflight-cloudflare-token.sh'
              - '.github/workflows/deploy*.yml'

  preflight:
    name: Preflight Cloudflare token
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && (needs.changes.outputs.landing == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.dashboard == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate Cloudflare deploy permissions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/preflight-cloudflare-token.sh

  deploy-landing:
    name: Deploy landing (hystersis.com)
    needs: [changes, preflight]
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'landing' || github.event.inputs.target == 'all')) ||
      (github.event_name == 'push' && needs.changes.outputs.landing == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Deploy landing via GitHub Actions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SANITY_PROJECT_ID: yhvdqwt4
        run: bash scripts/deploy-cloudflare.sh landing

  deploy-docs:
    name: Deploy docs (docs.hystersis.com)
    needs: [changes, preflight]
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'docs' || github.event.inputs.target == 'all')) ||
      (github.event_name == 'push' && needs.changes.outputs.docs == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy docs via GitHub Actions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/deploy-cloudflare.sh docs

  deploy-dashboard:
    name: Deploy dashboard (app.hystersis.com)
    needs: [changes, preflight]
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'dashboard' || github.event.inputs.target == 'all')) ||
      (github.event_name == 'push' && needs.changes.outputs.dashboard == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Deploy dashboard via GitHub Actions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_URL: https://api.hystersis.com
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || secrets.NEXTAUTH_SECRET }}
          BETTER_AUTH_API_KEY: ${{ secrets.BETTER_AUTH_API_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: bash scripts/deploy-cloudflare.sh dashboard

  verify-production:
    name: Verify production (domains + content)
    needs: [changes, deploy-dashboard, deploy-docs, deploy-landing]
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch') ||
        (github.event_name == 'push' && (needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.landing == 'true'))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify DNS for all domains
        run: bash scripts/verify-domains.sh

      - name: Verify dashboard sign-in bundle
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.dashboard == 'true'
        run: bash scripts/verify-production.sh dashboard

      - name: Verify Mintlify docs CSS
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.landing == 'true'
        run: bash scripts/verify-production.sh docs
