name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22'

permissions:
  contents: read
  security-events: write

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      landing: ${{ steps.filter.outputs.landing }}
      api_proxy: ${{ steps.filter.outputs.api_proxy }}
      docs: ${{ steps.filter.outputs.docs }}
      node_sdk: ${{ steps.filter.outputs.node_sdk }}
      python_sdk: ${{ steps.filter.outputs.python_sdk }}
      docker: ${{ steps.filter.outputs.docker }}
      ci_config: ${{ steps.filter.outputs.ci_config }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'Dockerfile'
              - '.golangci.yml'
            dashboard:
              - 'dashboard/**'
            landing:
              - 'landing/**'
              - 'install.sh'
              - 'wrangler.jsonc'
              - 'scripts/build-docs.sh'
            api_proxy:
              - 'workers/api-proxy.js'
              - 'wrangler.api.jsonc'
            docs:
              - 'docs/**'
              - 'scripts/build-docs.sh'
            node_sdk:
              - 'sdk/nodejs/**'
            python_sdk:
              - 'sdk/python/**'
            docker:
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'docker/**'
            ci_config:
              - '.github/**'

  go-backend:
    name: Go Backend
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.ci_config == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Golangci-lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
          args: --timeout=5m
      - name: Build
        run: go build -v ./...
      - name: Test (short, skip integration)
        run: |
          pkgs=$(go list ./... | grep -v '/tests$')
          go test -short -count=1 ${pkgs}
      - name: Vet
        run: go vet ./...

  dashboard:
    name: Dashboard
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.ci_config == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - name: Build Cloudflare bundle
        run: npm run build:open

  api-proxy:
    name: API Proxy Worker
    needs: changes
    if: needs.changes.outputs.api_proxy == 'true' || needs.changes.outputs.ci_config == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Syntax check
        run: node --check workers/api-proxy.js
      - name: Wrangler dry run
        run: npx wrangler deploy --config wrangler.api.jsonc --dry-run

  landing-page:
    name: Landing Page
    needs: changes
    if: needs.changes.outputs.landing == 'true' || needs.changes.outputs.ci_config == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify install.sh in dist
        run: |
          test -f dist/install.sh
          head -1 dist/install.sh | grep -q '#!/bin/bash'

  docs:
    name: Mintlify Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci_config == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate Mintlify
        working-directory: docs
        run: npx mintlify@latest validate
      - name: Build docs export
        run: bash scripts/build-docs.sh
      - name: Verify docs export
        run: |
          test -f landing/dist/docs/index.html
          test -d landing/dist/docs/_next
          grep -q '/_next/static/chunks/' landing/dist/docs/index.html
          css=$(grep -oE '/_next/static/chunks/[a-zA-Z0-9_-]+\.css' landing/dist/docs/index.html | head -1)
          test -n "$css"
          test -f "landing/dist/docs${css}"

  node-sdk:
    name: Node.js SDK
    needs: changes
    if: needs.changes.outputs.node_sdk == 'true' || needs.changes.outputs.ci_config == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/nodejs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sdk/nodejs/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  python-sdk:
    name: Python SDK
    needs: changes
    if: needs.changes.outputs.python_sdk == 'true' || needs.changes.outputs.ci_config == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e .[dev]
          pip install ruff pytest pytest-asyncio
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q

  security:
    name: Security
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.ci_config == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.2 && gosec -no-fail ./...
      - name: Secret scan
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          ! rg -n "(sk_live_|sk_test_|ghp_|gho_|AKIA|BEGIN (RSA |OPENSSH )?PRIVATE KEY)" \
            --glob '!*.md' \
            --glob '!*.mdx' \
            --glob '!.github/**' \
            --glob '!docs/**' \
            --glob '!internal/memory/privacy/**' \
            --glob '!dashboard/tests/**' \
            . || \
            (echo "Possible secret detected" && exit 1)

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - changes
      - go-backend
      - dashboard
      - api-proxy
      - landing-page
      - docs
      - node-sdk
      - python-sdk
      - security
    if: always()
    steps:
      - name: Check required jobs
        run: |
          check() {
            local job="$1"
            local result="$2"
            if [[ "$result" == "skipped" ]]; then
              echo "Job $job skipped"
              return 0
            fi
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "Job $job failed ($result)"
              exit 1
            fi
          }
          check go-backend "${{ needs.go-backend.result }}"
          check dashboard "${{ needs.dashboard.result }}"
          check api-proxy "${{ needs.api-proxy.result }}"
          check landing-page "${{ needs.landing-page.result }}"
          check docs "${{ needs.docs.result }}"
          check node-sdk "${{ needs.node-sdk.result }}"
          check python-sdk "${{ needs.python-sdk.result }}"
          check security "${{ needs.security.result }}"
          echo "All required CI checks passed"

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [ci-success]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Check Docker credentials
        id: docker
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ -n "$DOCKER_USERNAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to Docker Hub
        if: steps.docker.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: hystersis/hystersis
          tags: |
            type=sha,prefix=,suffix=
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        if: steps.docker.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
