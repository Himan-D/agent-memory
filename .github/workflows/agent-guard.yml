name: Agent Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    name: Validate agent PR conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Check PR title format
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const valid = /^(feat|fix|chore|docs|refactor|test|ci|build|perf|style)(\(.+\))?: .+/i.test(title);
            if (!valid) {
              core.warning(`PR title should follow Conventional Commits: "${title}"`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: '**Agent guard**: Please use Conventional Commits PR titles, e.g. `feat: add hybrid search` or `fix: serve install.sh`.',
              });
            }

      - name: Block committed secrets and artifacts
        run: |
          set -euo pipefail
          forbidden_patterns='^(agent|server|cli|agent-memory)$|deploy_key|PRODUCTION_SSH_KEY|/node_modules/|\.open-next/|landing/dist/docs/'
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | rg -n "$forbidden_patterns"; then
            echo "Forbidden files detected in PR"
            exit 1
          fi

      - name: Require go build for Go changes
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | rg -q '\.go$|go\.mod|go\.sum'; then
            go build ./...
          else
            echo "No Go changes — skipping build"
          fi
