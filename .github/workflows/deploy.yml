name: Deploy Landing Page

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'landing/**'
      - 'install.sh'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy landing to Cloudflare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build landing (includes install.sh sync)
        run: npm run build

      - name: Verify install.sh is in dist
        run: |
          test -f dist/install.sh
          head -1 dist/install.sh | grep -q '#!/bin/bash'

      - name: Deploy with Wrangler
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Deploy via webhook (fallback)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' && secrets.WEBHOOK_SECRET != '' }}
        working-directory: ${{ github.workspace }}
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          WEBHOOK_URL="https://hystersis.ai/webhook/hooks/deploy-landing"

          PAYLOAD='{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
          SIGNATURE=$(echo -n "${PAYLOAD}" | openssl dgst -sha256 -hmac "${WEBHOOK_SECRET}" | cut -d' ' -f2)

          curl -fsS -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=${SIGNATURE}" \
            -d "${PAYLOAD}"
