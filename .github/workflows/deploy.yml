name: Deploy Landing Page

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'landing/**'
      - 'install.sh'
      - 'api/**'
      - 'wrangler.jsonc'
      - 'workers/**'
      - 'scripts/build-docs.sh'
      - 'docs/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy landing to Cloudflare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build landing (syncs install.sh and agents.md)
        run: npm run build

      - name: Build Mintlify docs
        working-directory: ${{ github.workspace }}
        run: bash scripts/build-docs.sh

      - name: Verify install.sh is in dist
        run: |
          test -f dist/install.sh
          head -1 dist/install.sh | grep -q '#!/bin/bash'

      - name: Check deploy credentials
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "mode=cloudflare" >> "$GITHUB_OUTPUT"
          elif [ -n "$WEBHOOK_SECRET" ]; then
            echo "mode=webhook" >> "$GITHUB_OUTPUT"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy with Wrangler
        if: steps.deploy.outputs.mode == 'cloudflare'
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Deploy via webhook (fallback)
        if: steps.deploy.outputs.mode == 'webhook'
        working-directory: ${{ github.workspace }}
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          WEBHOOK_URL="https://hystersis.com/webhook/hooks/deploy-landing"
          PAYLOAD='{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
          SIGNATURE=$(echo -n "${PAYLOAD}" | openssl dgst -sha256 -hmac "${WEBHOOK_SECRET}" | cut -d' ' -f2)
          curl -fsS -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=${SIGNATURE}" \
            -d "${PAYLOAD}"

      - name: Skip deploy (no credentials)
        if: steps.deploy.outputs.mode == 'skip'
        run: echo "No CLOUDFLARE_API_TOKEN or WEBHOOK_SECRET — deploy skipped"
