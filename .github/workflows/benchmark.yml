name: Benchmark

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Benchmark dataset to run'
        default: 'all'
        type: choice
        options:
          - all
          - locomo
          - longmemeval
          - es_memeval
      mode:
        description: 'Search mode'
        default: 'hybrid'
        type: choice
        options:
          - vector
          - spreading
          - hybrid

env:
  GO_VERSION: '1.25'

jobs:
  benchmark:
    name: Benchmark Suite
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/test-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.12
        ports:
          - 6333:6333
          - 6334:6334
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-
      - name: Download dependencies
        run: go mod download
      - name: Build benchmark binary
        run: go build -o ./benchmark-bin ./cmd/benchmark
      - name: Run benchmarks
        run: >
          ./benchmark-bin
          --dataset=${{ github.event.inputs.dataset || 'all' }}
          --mode=${{ github.event.inputs.mode || 'hybrid' }}
          --concurrency=5
          --deterministic
          --output=benchmarks/ci
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test-password
          QDRANT_URL: http://localhost:6334
          REDIS_URL: redis://localhost:6379
      - name: Compare against baseline
        run: |
          LATEST=$(ls -d benchmarks/ci/*/ 2>/dev/null | sort | tail -1)
          if [ -n "$LATEST" ]; then
            python3 scripts/compare_benchmarks.py benchmarks/baseline.json "$LATEST/results_*.json" || true
          else
            echo "No benchmark results found - this is expected on first run"
          fi
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/ci/
      - name: Build
        run: go build -v ./...
