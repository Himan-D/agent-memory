name: OpenAI Repo Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Bot mode: monitor creates/updates an issue; contribute creates a PR"
        required: true
        default: "monitor"
        type: choice
        options:
          - monitor
          - contribute
      task:
        description: "Contribution task or monitoring focus"
        required: false
        default: "Review the repository for production-readiness gaps and propose the next highest-value improvement."
      model:
        description: "OpenAI model"
        required: false
        default: "gpt-5"
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: openai-repo-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repo-bot:
    name: Run OpenAI repository bot
    runs-on: ubuntu-latest
    if: github.repository_owner != ''
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure git identity
        run: |
          git config user.name "openai-repo-bot[bot]"
          git config user.email "openai-repo-bot[bot]@users.noreply.github.com"

      - name: Run bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_MODE: ${{ github.event.inputs.mode || 'monitor' }}
          BOT_TASK: ${{ github.event.inputs.task || 'Review the repository for production-readiness gaps and propose the next highest-value improvement.' }}
          BOT_MODEL: ${{ github.event.inputs.model || 'gpt-5' }}
          BOT_BASE_BRANCH: master
          BOT_BRANCH: cursor/openai-repo-bot-6161
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/openai-repo-bot.mjs

