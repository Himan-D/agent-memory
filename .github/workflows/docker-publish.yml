name: Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.2.3 or latest)'
        required: true
        default: 'latest'
      push_to_ghcr:
        description: 'Push to GHCR'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: monolith
            dockerfile: Dockerfile
            context: .
          - name: gateway
            dockerfile: cmd/gateway/Dockerfile
            context: .
          - name: mcp-server
            dockerfile: cmd/mcp-server/Dockerfile
            context: .
          - name: connectors
            dockerfile: cmd/connectors/Dockerfile
            context: .
          - name: memory-api
            dockerfile: cmd/memory-api/Dockerfile
            context: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event.inputs.push_to_ghcr == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=${{ github.event.inputs.version }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event.inputs.push_to_ghcr == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-multi-arch-manifest:
    name: Create Multi-arch Manifest (optional)
    needs: build-and-push
    if: github.event.inputs.push_to_ghcr == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create manifest for each service
        run: |
          for service in monolith gateway mcp-server connectors memory-api; do
            docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${service}:${{ github.event.inputs.version }} \
              --amend ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${service}:${{ github.event.inputs.version }} \
              || true
            docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${service}:${{ github.event.inputs.version }} || true
          done
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
