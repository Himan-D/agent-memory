[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hystersis"
version = "0.1.0"
description = "Persistent memory infrastructure for AI agents"
readme = "README.md"
authors = [
    {name = "Hystersis Team", email = "team@hystersis.ai"}
]
license = {file = "LICENSE"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
integrations = [
    "requests>=2.28.0",
]
all = [
    "hystersis[integrations]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://hystersis.com"
Documentation = "https://hystersis.com/docs"
Repository = "https://github.com/Himan-D/agent-memory"
Changelog = "https://hystersis.com/docs/changelog"

[tool.setuptools.packages.find]
where = ["."]
include = ["hystersis*"]
exclude = ["tests*", "examples*"]

[tool.ruff]
target-version = "py39"
exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",   # line too long (pre-existing across codebase)
    "F841",   # local variable assigned but never used (pre-existing)
    "E722",   # bare except (pre-existing)
    "F811",   # redefinition of unused name (pre-existing)
    "E402",   # module level import not at top (pre-existing)
    "E741",   # ambiguous variable name (pre-existing)
]

[tool.ruff.lint.per-file-ignores]
"hystersis/_async.py" = ["F401", "E303", "E302", "E301", "E711", "E712"]
"hystersis/integrations/*.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]




