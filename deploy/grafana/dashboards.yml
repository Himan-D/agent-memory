apiVersion: 1

providers:
  - name: "Hystersis Dashboards"
    orgId: 1
    folder: "Hystersis"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/hystersis
      foldersFromFilesStructure: true
