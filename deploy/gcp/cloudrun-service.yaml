apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hystersis
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 100
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/hystersis:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
          env:
            - name: ENVIRONMENT
              value: production
            - name: NEO4J_URI
              valueFrom:
                secretKeyRef:
                  name: hystersis-secrets
                  key: neo4j-uri
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hystersis-secrets
                  key: neo4j-password
            - name: QDRANT_URL
              valueFrom:
                secretKeyRef:
                  name: hystersis-secrets
                  key: qdrant-url
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hystersis-secrets
                  key: qdrant-api-key
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hystersis-secrets
                  key: llm-api-key
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: hystersis-secrets
                  key: redis-url
            - name: GCS_BUCKET
              value: hystersis-backups
            - name: STORAGE_PROVIDER
              value: gcs
            - name: GCP_PROJECT_ID
              value: PROJECT_ID
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 10
